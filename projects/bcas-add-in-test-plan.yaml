# Performance Test Plan for BCAS Add-in API
# Generated by perf-framework analyzer

service_name: bcas-add-in
service_type: rest-api
auth_type: jwt
base_url: https://bcas-add-in.qa-ue2.bcas.cudaops.com/  # Update with actual service URL

# Authentication Configuration
auth:
  type: bearer
  token_type: jwt
  # Note: JWT tokens should be obtained externally and configured before testing
  # Login endpoint removed from load tests (requires valid Microsoft token)

# API Endpoints for Load Testing
endpoints:
  # Health & Config
  - path: /api/v1/health
    method: GET
    requires_auth: false
    description: Liveness probe

  - path: /api/v1/config
    method: GET
    requires_auth: false
    description: Public runtime configuration

  # Authentication
  - path: /api/v1/auth/logout
    method: POST
    requires_auth: true
    description: Session termination

  - path: /api/v1/me
    method: GET
    requires_auth: true
    description: Current user information

  # Archive Operations (Primary API Surface)
  - path: /api/archive/documents/{documentId}
    method: GET
    requires_auth: true
    description: Retrieve archived document
    path_params:
      - documentId

  - path: /api/archive/documents/{documentId}/attachments/{attachmentIdx}
    method: GET
    requires_auth: true
    description: Retrieve document attachment
    path_params:
      - documentId
      - attachmentIdx

  - path: /api/archive/forward-attachment
    method: POST
    requires_auth: true
    description: Forward archived message attachment

  - path: /api/archive/forward-draft
    method: POST
    requires_auth: true
    description: Create forward draft

  - path: /api/archive/forward-draft/delete
    method: POST
    requires_auth: true
    description: Delete forward draft

  - path: /api/archive/reply-draft
    method: POST
    requires_auth: true
    description: Create reply draft

  # Search
  - path: /api/search
    method: POST
    requires_auth: true
    description: Search archived messages

  # Analytics
  - path: /api/mixpanel/track
    method: POST
    requires_auth: true
    description: Track user event

  - path: /api/mixpanel/track-pre-login
    method: POST
    requires_auth: false
    description: Track pre-login event

# API Documentation
swagger:
  title: BCAS Add-in API
  description: REST surface served by the BCAS Outlook add-in backend
  version: "1.0"
  docs_path: /api/docs
  spec_path: /api/docs-json

# Technology Stack
technology:
  framework: NestJS
  language: TypeScript
  runtime: Node.js

# Notes for Load Testing
notes:
  - Service uses JWT Bearer authentication
  - Most endpoints require authentication except health, config, and login
  - Archive operations are the primary load test targets
  - Body size limit is 4MB for JSON payloads
  - CORS is configured for specific origins
  - Service can run on HTTPS in dev mode

# Recommended Test Scenarios
test_scenarios:
  - name: login_flow
    description: Test authentication login/logout
    endpoints:
      - POST /api/auth/login
      - GET /api/me
      - POST /api/auth/logout

  - name: document_retrieval
    description: Test document and attachment retrieval
    endpoints:
      - GET /api/archive/documents/{documentId}
      - GET /api/archive/documents/{documentId}/attachments/{attachmentIdx}

  - name: draft_operations
    description: Test draft creation and deletion
    endpoints:
      - POST /api/archive/forward-draft
      - POST /api/archive/reply-draft
      - POST /api/archive/forward-draft/delete

  - name: search_and_track
    description: Test search and analytics
    endpoints:
      - POST /api/search
      - POST /api/mixpanel/track
